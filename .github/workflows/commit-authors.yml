---
# Every new commit must credit someone in .github/commit-authors, as author or
# co-author. Make this a required status check on main (branch protection) so
# nothing merges without it.
name: commit-authors

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every new commit credits a listed author
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          python3 .github/scripts/check_commit_authors.py "$range"
