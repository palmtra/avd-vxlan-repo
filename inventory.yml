---
# -----------------------------------------------------------------------------
# Leaves (VTEPs) per data center.
#
# <DC>_FABRIC    Facts about the running fabric that AVD needs to compute
#                route distinguishers and to run at all (node ids, ASN,
#                router-id, MLAG pairing). Mirrored from production. Nothing
#                in it is rendered or deployed.
# <DC>_SERVICES  Network services this repo owns: the VLANs, SVIs and VNIs
#                added by the VXLAN migration. This is all that is rendered.
#
# Leaf pairs are the node_groups in group_vars/<DC>_FABRIC.yml. A service is
# placed on leaf pairs with `tags: [<node group>]`.
#
# Only VTEP leaves are listed: non-VTEP switches and the legacy MLS get no
# AVD config. Both DCs are production.
#
# The two DCs are isolated (no multisite). They are built separately and
# deployed with separate change controls.
# -----------------------------------------------------------------------------
all:
  children:
    LISLE:
      children:
        LISLE_FABRIC:
          children:
            LISLE_LEAVES:
        LISLE_SERVICES:
          children:
            LISLE_LEAVES:
    LISLE_LEAVES:
      hosts:
        chi01-blf01:
        chi01-blf02:
        fnts-chi01-aggacc-sw01:
        fnts-chi01-aggacc-sw02:
        fnts-chi01-aggacc-sw05:
        fnts-chi01-aggacc-sw06:
        fnts-chi01-aggacc-sw11:
        fnts-chi01-aggacc-sw12:

    OMAHA:
      children:
        OMAHA_FABRIC:
          children:
            OMAHA_LEAVES:
        OMAHA_SERVICES:
          children:
            OMAHA_LEAVES:
    OMAHA_LEAVES:
      hosts:
        oma01-blf01:
        oma01-blf02:
        fntc-aggacc-sw01:
        fntc-aggacc-sw02:
        fntc-aggacc-sw05:
        fntc-aggacc-sw06:
        fntc-aggacc-sw11:
        fntc-aggacc-sw12:
        fntc-aggacc-sw13:
        fntc-aggacc-sw14:
        fntc-aggacc-sw101:
        fntc-aggacc-sw102:
        oma-ce-sw01:
        oma-ce-sw02:
