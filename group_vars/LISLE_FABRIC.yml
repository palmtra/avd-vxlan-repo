---
# -----------------------------------------------------------------------------
# Lisle (chi01) fabric facts, mirrored from production. NOT rendered, NOT deployed.
#
# AVD needs a fabric to place network services on. Only the service keys of
# its output (VLANs, SVIs, VXLAN VLAN-to-VNI maps, router bgp vlan blocks) go
# into the migration configlet. Everything here only has to be right where it
# shows up in those keys:
#   - loopback_ipv4_address  router-id, the admin field of each VLAN's RD
#   - bgp_as                 the `router bgp <asn>` line the VLAN blocks sit in
# EVPN VLAN scheme (both DCs): RD <router-id>:<vlan id>, route-target both
# <l2 vni>:<vlan id>. The render applies it to every service (rd_override /
# rt_override); see avd_services/render.py.
# Pools, MLAG interfaces and the virtual router MAC must be present for AVD to
# run but never reach a device.
#
# Production values (bgp_as, Loopback0 per leaf). The pools, MLAG interfaces
# and virtual router MAC below are filler that never reaches a device.
# -----------------------------------------------------------------------------
_fabric_facts_verified: true
data_center: lisle

fabric_name: LISLE
type: l3leaf

# Leaf pair external gateways (firewalls) attach to. A VLAN whose gateway
# stays outside the fabric must be on it; a service that differs sets
# _migration.external_gateway_pair (manual override).
_external_gateway_pair: BLF01_02

l3leaf:
  defaults:
    # Required by AVD, not rendered.
    loopback_ipv4_pool: 192.0.2.0/26
    vtep_loopback_ipv4_pool: 192.0.2.64/26
    mlag_peer_ipv4_pool: 192.0.2.128/26
    mlag_peer_l3_ipv4_pool: 192.0.2.192/26
    virtual_router_mac_address: "00:1c:73:00:00:99"
    mlag_interfaces: [Ethernet47, Ethernet48]
  node_groups:
    # One node group per MLAG leaf pair. The group name is the tag services
    # use. bgp_as is written as the switch shows it (asplain or asdot).
    - group: BLF01_02            # border leaves: firewalls / external gateways
      bgp_as: "20034"
      nodes:
        - name: chi01-blf01
          id: 1
          loopback_ipv4_address: 66.180.0.17
        - name: chi01-blf02
          id: 2
          loopback_ipv4_address: 66.180.0.18
    - group: AGGACC01_02
      bgp_as: "4200000202"
      nodes:
        - name: fnts-chi01-aggacc-sw01
          id: 3
          loopback_ipv4_address: 66.180.0.21
        - name: fnts-chi01-aggacc-sw02
          id: 4
          loopback_ipv4_address: 66.180.0.22
    - group: AGGACC05_06
      bgp_as: "64086.60107"      # sw05/06 run `bgp asn notation asdot` (= 4200000203)
      nodes:
        - name: fnts-chi01-aggacc-sw05
          id: 5
          loopback_ipv4_address: 66.180.0.23
        - name: fnts-chi01-aggacc-sw06
          id: 6
          loopback_ipv4_address: 66.180.0.24
    - group: AGGACC11_12
      bgp_as: "4200000204"
      nodes:
        - name: fnts-chi01-aggacc-sw11
          id: 7
          loopback_ipv4_address: 66.180.0.25
        - name: fnts-chi01-aggacc-sw12
          id: 8
          loopback_ipv4_address: 66.180.0.26
