# -----------------------------------------------------------------------------
# Lisle network services owned by the VXLAN migration.
#
# Each migrated VLAN is one entry: an SVI under its VRF when the gateway moves
# to the fabric, or an l2vlan when the gateway stays external (firewall).
# The vxlan-migration repo opens a PR that adds the entry. CI renders the
# configlets and the PR shows the exact CLI per leaf under intended/configs/.
#
# Rules (enforced by `python -m avd_services check`):
#   - vni_override is required and must sit in this DC's range for _migration.vni_pool.
#   - tags are leaf pairs (node groups in LISLE_FABRIC.yml) that carry the VLAN:
#     pairs with endpoints, the gateway pair, and for an external gateway the
#     pair the firewall attaches to (usually BLF01_02).
#   - SVIs use ip_address_virtual (anycast) only: no secondaries, no DHCP relay.
#   - mtu at most 9214 (the EOS SVI maximum).
#   - RD is <router-id>:<vlan id> and route-target both <l2 vni>:<vlan id>.
#     The render fills rd_override / rt_override from that; a value that
#     differs is a warning.
#   - Each SVI's subnet gets `network <subnet>` under its VRF in router bgp
#     on every leaf with the SVI (not for VRF default).
#   - VRFs already exist on the fabric. They are listed so AVD can place the
#     SVI; the VRF itself is never rendered. vrf_vni must be the fabric value.
#   - Centralized anycast: the SVI is tagged with the gateway pair and the same
#     VLAN id is an l2vlan tagged with every other pair that carries it.
#
# Example (distributed anycast, VLAN 951 on two leaf pairs):
#   tenants:
#     - name: LISLE_MIGRATION
#       vrfs:
#         - name: v0000001a
#           vrf_vni: <the VRF's L3 VNI from show interfaces Vxlan1>
#           svis:
#             - id: 951
#               name: WEB
#               enabled: true
#               tags: [AGGACC01_02, AGGACC05_06]
#               ip_address_virtual: 10.100.0.1/24
#               mtu: 9214
#               vni_override: 20951
#               rd_override: 951
#               rt_override: "20951:951"
#               _migration:
#                 vni_pool: customer
#                 gateway_mode: distributed_anycast
#                 source: legacy VLAN 951 on fnts-chi01-aggpe-ml01/02
# -----------------------------------------------------------------------------
tenants: []
