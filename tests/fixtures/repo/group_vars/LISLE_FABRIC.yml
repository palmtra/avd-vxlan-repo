  node_groups:
    - group: PAIR1
      bgp_as: "65101"
      nodes:
        - {name: leaf1a, id: 1, loopback_ipv4_address: 10.250.0.1}
        - {name: leaf1b, id: 2, loopback_ipv4_address: 10.250.0.2}
    - group: PAIR2
      bgp_as: "65102"
      nodes:
        - {name: leaf2a, id: 3, loopback_ipv4_address: 10.250.0.3}
        - {name: leaf2b, id: 4, loopback_ipv4_address: 10.250.0.4}
