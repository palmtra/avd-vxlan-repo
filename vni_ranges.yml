---
# -----------------------------------------------------------------------------
# L2 VNI ranges per data center and customer type. Same content as
# vxlan-migration/inventory/group_vars/all/vni_ranges.yml: the migration picks
# the VNI, this repo checks it is in range. NetBox replaces both later.
#
# Standard (incrementing by 1 from the start):
#   Lisle  internal 20000   external customers 22000
#   Omaha  internal 10000   external customers 11000
# L3 VNIs do not follow this standard; they are not range-checked here.
# The end values are each block's start up to just below the next block.
#
# A service's _migration.customer_type picks the range (default:
# vni_default_customer_type). Ranges must not overlap.
# -----------------------------------------------------------------------------
vni_ranges:
  lisle:
    internal: {start: 20000, end: 21999}
    external: {start: 22000, end: 23999}
  omaha:
    internal: {start: 10000, end: 10999}
    external: {start: 11000, end: 11999}

vni_default_customer_type: external
